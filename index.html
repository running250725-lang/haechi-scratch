<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>해치의 연말 복권 긁기</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#111;font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.page{max-width:1536px;margin:auto;background:#111;min-height:100vh}
.hero{position:relative;width:100%}.heroImg{display:block;width:100%;height:auto}
.scratch{position:absolute;left:45.2%;top:52.8%;width:42.7%;height:27.2%;overflow:hidden;border-radius:3%}
.result{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:radial-gradient(circle,#fff9db,#ffe29a);padding:4%;color:#a91f2f}
.ico{font-size:clamp(28px,6vw,76px)}.name{font-weight:1000;font-size:clamp(12px,2.5vw,34px);line-height:1.25;text-shadow:0 2px #fff}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.bar{background:#fff8e8;color:#382617;padding:13px 14px 18px;text-align:center;border-top:4px solid #e2a933}
.msg{font-weight:900;font-size:13px;margin-bottom:9px}.row{display:flex;gap:8px;max-width:650px;margin:auto}
.row input{width:38%;min-width:0;padding:12px;border:2px solid #dccaa7;border-radius:11px;text-align:center;font-size:19px;letter-spacing:5px}
.row button{flex:1;border:0;border-radius:11px;background:#c72538;color:#fff;font-weight:900}
.review{display:block;max-width:650px;margin:9px auto 0;padding:12px;border-radius:11px;background:#03c75a;color:white;text-decoration:none;font-weight:900}
.done{display:none;color:#b41f31;font-weight:1000;margin-top:10px}.done.on{display:block}
</style></head>
<body><main class="page">
<div class="hero">
<img class="heroImg" src="assets/haechi-original.png" alt="해치의 연말 복권 긁기">
<div class="scratch" id="box"><div class="result"><div class="ico" id="ico">🎁</div><div class="name" id="name">행운의 상품</div></div><canvas id="cv"></canvas></div>
</div>
<div class="bar"><div id="msg" class="msg">네이버 리뷰 작성 후 직원 인증을 해주세요.</div>
<div class="row"><input id="pw" type="password" inputmode="numeric" maxlength="4" placeholder="••••"><button onclick="unlock()">직원 인증</button></div>
<a class="review" href="https://m.place.naver.com/my" target="_blank">N 네이버 리뷰 작성하기</a>
<div id="done" class="done">🎉 당첨 결과 공개! 직원에게 이 화면을 보여주세요.</div></div>
</main>
<script>
const K="HAECHI_ORIGINAL_V5";
const P=[{n:"한강 크루즈 티켓 1장",i:"🚢",w:.3},{n:"연극 티켓 1장",i:"🎭",w:1},{n:"달고나 1개 + 물티슈 1개",i:"🍬",w:65.7},{n:"포스트잇 1개 + 볼펜 1개",i:"📝",w:33}];
let s={ok:false,p:null,done:false};try{s=Object.assign(s,JSON.parse(localStorage.getItem(K)||"{}"))}catch(e){}
const save=()=>localStorage.setItem(K,JSON.stringify(s));
function draw(){let r=Math.random()*100,a=0;for(const p of P){a+=p.w;if(r<a)return[p.n,p.i]}}
function unlock(){if(pw.value!=="0725"){msg.textContent="❌ 인증번호를 확인해주세요.";return}s.ok=true;if(!s.p)s.p=draw();save();msg.textContent="✨ 인증 완료! 회색 복권 부분을 충분히 긁어주세요.";show()}
function show(){if(!s.ok)return;name.textContent=s.p[0];ico.textContent=s.p[1];setTimeout(init,80)}
function init(){let c=cv,x=c.getContext("2d"),r=box.getBoundingClientRect(),D=devicePixelRatio||1;c.width=r.width*D;c.height=r.height*D;x.scale(D,D);if(s.done){c.style.display="none";done.classList.add("on");msg.textContent="100% 공개 완료";return}
let g=x.createLinearGradient(0,0,r.width,r.height);g.addColorStop(0,"#8e9396");g.addColorStop(.5,"#e8eaeb");g.addColorStop(1,"#8e9396");x.fillStyle=g;x.fillRect(0,0,r.width,r.height);x.fillStyle="#62676a";x.textAlign="center";x.font="900 "+Math.max(12,r.width*.06)+"px Arial";x.fillText("SCRATCH",r.width/2,r.height*.48);x.globalCompositeOperation="destination-out";
let down=false,last=0;function pos(e){let q=c.getBoundingClientRect();return[e.clientX-q.left,e.clientY-q.top]}function pct(){let a=x.getImageData(0,0,c.width,c.height).data,cl=0,tot=0;for(let j=3;j<a.length;j+=64){tot++;if(a[j]===0)cl++}return Math.round(cl/tot*100)}
function check(){let p=pct();msg.textContent="🎟️ 복권을 조금 더 긁어주세요!";if(p>=70){s.done=true;save();msg.textContent="✨ 당첨 결과 공개!";c.style.transition="opacity .6s";c.style.opacity=0;setTimeout(()=>c.style.display="none",600);done.classList.add("on")}}
function go(e){if(!down||s.done)return;e.preventDefault();let[a,b]=pos(e);x.beginPath();x.arc(a,b,Math.max(12,r.width*.04),0,Math.PI*2);x.fill();if(Date.now()-last>200){last=Date.now();check()}}
c.onpointerdown=e=>{if(!s.ok){msg.textContent="🔐 먼저 직원 인증을 해주세요.";return}down=true;c.setPointerCapture(e.pointerId);go(e)};c.onpointermove=go;c.onpointerup=()=>{down=false;check()};c.onpointercancel=()=>down=false}
if(s.ok&&s.p){msg.textContent="✨ 회색 복권 부분을 충분히 긁어주세요.";show()}
</script></body></html>
