<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>해치 럭키 스크래치</title><style>
*{box-sizing:border-box}body{margin:0;background:#123326;font-family:Arial,sans-serif}.w{max-width:500px;margin:auto;padding:18px}.h{text-align:center;color:white}.h h1{margin:8px}.c,.ticket{background:#fff8e8;border:4px solid #dfa83b;border-radius:22px;padding:18px;margin:14px 0}.tag{background:#c82b3d;color:white;border-radius:20px;padding:5px 10px;font-weight:bold;font-size:11px}.nav,.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;color:white;font-weight:bold;text-align:center;text-decoration:none}.nav{background:#03c75a}.btn{background:#c82b3d}.pw{width:100%;padding:12px;margin:9px 0;border:2px solid #ddd;border-radius:12px;text-align:center;font-size:22px}.ticket{display:none;text-align:center;background:#ffe9a7}.ticket.on{display:block}.box{position:relative;aspect-ratio:1.7;background:white;border:4px solid #b97a28;border-radius:15px;overflow:hidden;margin-top:14px}.prize{position:absolute;inset:0;display:grid;place-content:center;background:#fff8d6}.prize b{font-size:27px;color:#bd2235}.prize span{font-size:55px}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.done{display:none;color:#b92033;font-weight:bold;margin-top:10px}.done.on{display:block}</style></head><body><main class="w"><div class="h"><small>DYNAMIC MAZE · REVIEW EVENT</small><h1>🎟️ 해치의 LUCKY SCRATCH</h1><p>후기를 남기고 행운의 복권을 긁어보세요!</p></div><section class="c"><span class="tag">STEP 1</span><h2>네이버 리뷰 작성</h2><p>오늘 체험에 대한 솔직한 후기를 자유롭게 남겨주세요.</p><a class="nav" target="_blank" href="https://m.place.naver.com/my">N 네이버 리뷰 쓰러가기 ›</a></section><section class="c"><span class="tag">STEP 2</span><h2>직원 확인 🔐</h2><input id="pw" class="pw" type="password" maxlength="4" inputmode="numeric" placeholder="••••"><button class="btn" onclick="unlock()">직원 인증하기</button><p id="err"></p></section><section id="ticket" class="ticket"><h2>✨ 행운의 복권 ✨</h2><b>은색 부분을 손가락으로 긁어주세요!</b><div class="box" id="box"><div class="prize"><span id="ico">🎁</span><b id="name">상품 당첨!</b></div><canvas id="cv"></canvas></div><div id="done" class="done">🎉 당첨 결과 공개! 직원에게 이 화면을 보여주세요.</div></section></main><script>
const K="SCRATCH2026",P=[["상품 1","🎁"],["상품 2","🥤"],["상품 3","🍬"],["상품 4","⭐"],["상품 5","🎀"]];let s={ok:false,p:null,done:false};try{s=Object.assign(s,JSON.parse(localStorage.getItem(K)||"{}"))}catch(e){};function save(){localStorage.setItem(K,JSON.stringify(s))}
function unlock(){if(pw.value!=="0725"){err.textContent="인증번호가 맞지 않습니다.";return}s.ok=true;if(!s.p)s.p=P[Math.floor(Math.random()*P.length)];save();open()}
function open(){ticket.classList.add("on");ico.textContent=s.p[1];name.textContent=s.p[0]+" 당첨!";setTimeout(init,100)}
function init(){let c=cv,x=c.getContext("2d"),r=box.getBoundingClientRect(),D=devicePixelRatio||1;c.width=r.width*D;c.height=r.height*D;x.scale(D,D);if(s.done){c.style.display="none";done.classList.add("on");return}let g=x.createLinearGradient(0,0,r.width,r.height);g.addColorStop(0,"#999");g.addColorStop(.5,"#eee");g.addColorStop(1,"#999");x.fillStyle=g;x.fillRect(0,0,r.width,r.height);x.fillStyle="#555";x.textAlign="center";x.font="bold 18px Arial";x.fillText("SCRATCH HERE",r.width/2,r.height/2);x.globalCompositeOperation="destination-out";let down=false,m=0;function pos(e){let q=c.getBoundingClientRect();return[e.clientX-q.left,e.clientY-q.top]}function go(e){if(!down)return;e.preventDefault();let[a,b]=pos(e);x.beginPath();x.arc(a,b,25,0,7);x.fill();if(++m>35){s.done=true;save();c.style.opacity=0;setTimeout(()=>c.style.display="none",400);done.classList.add("on")}}c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);go(e)};c.onpointermove=go;c.onpointerup=()=>down=false}if(s.ok&&s.p)open();
</script></body></html>
