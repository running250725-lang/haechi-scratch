<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>해치의 연말 복권 긁기</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#10251b;font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.page{max-width:900px;margin:auto;min-height:100vh;background:#10251b}.hero{position:relative;width:100%;line-height:0}.hero>img{width:100%;display:block}.scratchArea{position:absolute;left:43.5%;top:51.7%;width:45.7%;height:29.7%;border-radius:4%;overflow:hidden;line-height:normal}.prize{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:radial-gradient(circle,#fff9d8,#ffe89c);padding:4%}.prize .ico{font-size:clamp(30px,7vw,72px)}.prize .name{font-weight:1000;color:#b72331;font-size:clamp(14px,3.1vw,32px);line-height:1.25;text-shadow:0 2px #fff}.prize small{font-weight:900;color:#7a5422;margin-top:5px;font-size:clamp(9px,1.7vw,16px)}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}.panel{margin:-1px 12px 18px;background:#fff8e8;border:4px solid #e5ae39;border-radius:0 0 20px 20px;padding:14px;text-align:center;color:#3d2a18}.panel b{color:#bd2636}.progress{font-size:12px;font-weight:900;margin-bottom:8px}.controls{display:flex;gap:8px}.controls input{width:42%;min-width:0;border:2px solid #decdaa;border-radius:11px;padding:11px;text-align:center;font-size:18px;letter-spacing:5px}.controls button{flex:1;border:0;border-radius:11px;background:#c62739;color:#fff;font-weight:900}.review{display:block;margin-top:9px;padding:12px;background:#03c75a;color:#fff;border-radius:11px;text-decoration:none;font-weight:900}.done{display:none;margin-top:10px;color:#b51f30;font-weight:1000}.done.on{display:block}
@media(max-width:520px){.page{width:100%}.panel{margin-left:7px;margin-right:7px}.scratchArea{left:43%;width:46.5%}}
</style></head><body><main class="page">
<div class="hero"><img src="assets/haechi-frame.jpg" alt="해치의 연말 복권 긁기">
<div class="scratchArea" id="box"><div class="prize"><div class="ico" id="ico">🎁</div><div class="name" id="name">행운의 상품</div><small>복권을 긁어 확인하세요!</small></div><canvas id="cv"></canvas></div></div>
<section class="panel"><div class="progress" id="prog">리뷰 작성 후 직원 인증을 해주세요.</div>
<div class="controls"><input id="pw" type="password" inputmode="numeric" maxlength="4" placeholder="••••"><button onclick="unlock()">직원 인증 · 복권 열기</button></div>
<a class="review" href="https://m.place.naver.com/my" target="_blank">N 네이버 리뷰 작성하기</a><div id="done" class="done">🎉 당첨 결과 공개! 직원에게 이 화면을 보여주세요.</div></section>
</main><script>
const K="HAECHI_FRAME_SCRATCH_V4";
const P=[{n:"한강 크루즈 티켓 1장",i:"🚢",w:.3},{n:"연극 티켓 1장",i:"🎭",w:1},{n:"달고나 1개 + 물티슈 1개",i:"🍬",w:65.7},{n:"포스트잇 1개 + 볼펜 1개",i:"📝",w:33}];
let s={ok:false,p:null,done:false};try{s=Object.assign(s,JSON.parse(localStorage.getItem(K)||"{}"))}catch(e){}
const save=()=>localStorage.setItem(K,JSON.stringify(s));
function draw(){let r=Math.random()*100,a=0;for(let p of P){a+=p.w;if(r<a)return[p.n,p.i]}return[P.length-1]}
function unlock(){if(pw.value!=="0725"){prog.textContent="❌ 인증번호를 확인해주세요.";return}s.ok=true;if(!s.p)s.p=draw();save();prog.textContent="✨ 인증 완료! 회색 복권 부분을 70% 이상 긁어주세요.";show()}
function show(){if(!s.ok)return;name.textContent=s.p[0];ico.textContent=s.p[1];setTimeout(init,80)}
function init(){let c=cv,x=c.getContext("2d"),r=box.getBoundingClientRect(),D=devicePixelRatio||1;c.width=r.width*D;c.height=r.height*D;x.scale(D,D);if(s.done){c.style.display="none";done.classList.add("on");prog.textContent="100% 공개 완료";return}
let g=x.createLinearGradient(0,0,r.width,r.height);g.addColorStop(0,"#8d9296");g.addColorStop(.48,"#e7e9ea");g.addColorStop(1,"#8f9498");x.fillStyle=g;x.fillRect(0,0,r.width,r.height);x.fillStyle="#62676a";x.textAlign="center";x.font="900 "+Math.max(13,r.width*.065)+"px Arial";x.fillText("SCRATCH",r.width/2,r.height*.46);x.font="bold "+Math.max(9,r.width*.035)+"px Arial";x.fillText("70% 이상 긁어주세요",r.width/2,r.height*.61);x.globalCompositeOperation="destination-out";
let down=false,last=0;function pos(e){let q=c.getBoundingClientRect();return[e.clientX-q.left,e.clientY-q.top]}function pc(){let a=x.getImageData(0,0,c.width,c.height).data,cl=0,tot=0;for(let j=3;j<a.length;j+=64){tot++;if(a[j]===0)cl++}return Math.round(cl/tot*100)}function check(){let p=pc();prog.textContent="🎟️ 현재 "+p+"% 긁었어요 · 70% 이상 긁어주세요";if(p>=70){s.done=true;save();prog.textContent="✨ 100% 공개 완료!";c.style.transition="opacity .65s";c.style.opacity=0;setTimeout(()=>c.style.display="none",650);done.classList.add("on")}}function go(e){if(!down||s.done)return;e.preventDefault();let[a,b]=pos(e);x.beginPath();x.arc(a,b,Math.max(14,r.width*.045),0,Math.PI*2);x.fill();if(Date.now()-last>200){last=Date.now();check()}}c.onpointerdown=e=>{if(!s.ok){prog.textContent="🔐 먼저 직원 인증을 해주세요.";return}down=true;c.setPointerCapture(e.pointerId);go(e)};c.onpointermove=go;c.onpointerup=()=>{down=false;check()};c.onpointercancel=()=>down=false}
if(s.ok&&s.p){prog.textContent="✨ 인증 완료! 회색 복권 부분을 긁어주세요.";show()}
</script></body></html>
